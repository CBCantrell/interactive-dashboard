<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Christie Cantrell for the WEB-115 course at Wake Tech</p>
    <p>This dashboard demonstrates how JavaScript can be used to create interactive websites.</p>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. --> 
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
            <div class="col" id="weekly-tasks">
                <h2>Weekly Task Goals</h2>
                <script src="js/task-manager.js" defer></script>
                <form>
                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name">
                    <label for="daily-goal">Daily Task Goal:</label>
                    <input type="number" id="daily-goal">
                    <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks">
                    <button id="goal-btn">Calculate Weekly Goal</button>
                </form>
                <p id="goal-message"></p>
            </div>
            <div class="col" id="metric-converter">
                <h2>Imperial/Metric Converter</h2>
                <form>
                    <label for="metric-value">Value:</label>
                    <input type="number" id="metric-value">
                    <label for="conversion-type">Conversion:</label>
                    <select id="conversion-type">
                        <option value="in to cm">Inches to Centimeters</option>
                        <option value="ft to cm">Feet to Centimeters</option>
                        <option value="yd to m">Yards to Meters</option>
                        <option value="mi to km">Miles to Kilometers</option>
                        <option value="cm to in">Centimeters to Inches</option>
                        <option value="cm to ft">Centimeters to Feet</option>
                        <option value="m to yd">Meters to Yards</option>
                        <option value="km to mi">Kilometers to Miles</option>
                    </select>
                    <button id="convert-btn">Convert</button>       
                </form>
                <p id="conversion-result"></p>
                <script src="js/metric-converter.js" defer></script>
            </div>        
        </div>
    </div>
</body>
</html>
